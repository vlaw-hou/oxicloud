services:

  oxicloud:
    container_name: oxicloud
    image: diocrafts/oxicloud:0.8.9
    networks: 
      - caddynet
    ports:
      - "127.0.0.1:8186:8086"
    environment:
      # Return freed heap pages to the OS promptly. mimalloc retains them by
      # default, so idle RSS clamps at the peak even after the in-memory caches
      # expire; purging immediately makes RSS track the live working set
      # (benchmarked: ~400 MB reclaimed on musl/aarch64) at no throughput cost.
      # Also baked into the Dockerfile; set here so it applies to the prebuilt
      # image too.
      MIMALLOC_PURGE_DELAY: "0"
    volumes:
      - /opt/vps3/vps3-data/db-postgres/oxicloud/db-data:/app/storage
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8186/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres: # use pgAdmin4 instead
    container_name: postgres
    image: postgres:18.2-alpine3.23
    networks:
      - caddynet    
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oxicloud
    volumes:
      - pg_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
networks:
  caddynet:
    external: true


