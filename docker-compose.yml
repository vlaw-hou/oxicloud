
networks:
  caddynet:
    external: true

services:
  oxicloud:
    container_name: oxicloud
    image: diocrafts/oxicloud:0.8.9
    env_file:
      - .env    
    networks: 
      - caddynet
    ports:
      - "127.0.0.1:8186:8086"
    environment:
      # Return freed heap pages to the OS promptly. mimalloc retains them by
      # default, so idle RSS clamps at the peak even after the in-memory caches
      # expire; purging immediately makes RSS track the live working set
      # (benchmarked: ~400 MB reclaimed on musl/aarch64) at no throughput cost.
      # Also baked into the Dockerfile; set here so it applies to the prebuilt
      # image too.
      MIMALLOC_PURGE_DELAY: "0"
      OXICLOUD_DB_CONNECTION_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/oxicloud
    volumes:
      # stores actual files/ objects on vps5
      - /mnt/vps5-nfs/vps5-data/ext4-files/oxicloud/data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3      
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_started



